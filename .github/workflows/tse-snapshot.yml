name: TSE source snapshot

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Source manifest to snapshot
        required: true
        default: data/sources/tse/2026-sc-r1.json
        type: string
  push:
    branches:
      - main
    paths:
      - 'data/sources/tse/requests/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve source manifests
        id: source
        shell: bash
        run: |
          mkdir -p /tmp/atlas
          : > /tmp/atlas/manifests.txt

          if [ -n "${{ inputs.manifest_path }}" ]; then
            printf '%s\n' "${{ inputs.manifest_path }}" >> /tmp/atlas/manifests.txt
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep '^data/sources/tse/requests/.*\.json$' |
              while read -r request; do
                python - "$request" <<'PY' >> /tmp/atlas/manifests.txt
          import json
          import sys
          from pathlib import Path

          request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(request["sourceManifest"])
          PY
              done
          fi

          sort -u /tmp/atlas/manifests.txt -o /tmp/atlas/manifests.txt
          if [ ! -s /tmp/atlas/manifests.txt ]; then
            echo "No source manifests resolved." >&2
            exit 1
          fi
          cat /tmp/atlas/manifests.txt

      - name: Capture official sources
        shell: bash
        run: |
          while read -r manifest; do
            source_id="$(python - "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["id"])
          PY
            )"
            python scripts/fetch_tse_snapshot.py "$manifest" --out-dir "raw-snapshots/$source_id"
          done < /tmp/atlas/manifests.txt

      - name: Upload source snapshots
        uses: actions/upload-artifact@v4
        with:
          name: tse-source-snapshot-${{ github.run_id }}
          path: raw-snapshots/
          if-no-files-found: error
          retention-days: 90
