name: Publish Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pipelines/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Foundation release gate
        run: |
          npm ci --no-audit --no-fund
          pip install jsonschema==4.26.0
          npm run verify:foundation
      - name: Install pinned dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Typecheck and produce web bundle
        run: npm run build --prefix apps/web
      - name: Check asset budgets
        run: node scripts/check_web_budget.mjs
      - name: Run F6 comparison regression tests
        run: npm run test --prefix apps/web
      - name: Install browser for release gate
        working-directory: apps/web
        run: npx playwright install chromium webkit --with-deps
      - name: Desktop and mobile release gate
        run: npm run test:e2e --prefix apps/web
      - name: Upload for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
