name: Web build
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned web dependencies
        run: npm install --prefix apps/web --no-audit --no-fund
      - name: Build React and Vite
        run: npm run build --prefix apps/web
      - name: Upload static site artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
