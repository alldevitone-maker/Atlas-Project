name: Bootstrap Atlas source
on:
  push:
    branches:
      - build/atlas-v0.2.1
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Wait for final archive part
        id: ready
        shell: bash
        run: |
          if [ -f .bootstrap/archive.part08 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expand source archive
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .bootstrap/archive.part* > /tmp/atlas.tar.gz.b64
          base64 -d /tmp/atlas.tar.gz.b64 > /tmp/atlas.tar.gz
          tar -xzf /tmp/atlas.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit expanded source
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "build: bootstrap Atlas v0.2.1 source"
          git push origin HEAD:${{ github.ref_name }}
